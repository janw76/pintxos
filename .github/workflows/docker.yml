name: build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'LICENSE']

permissions:
  contents: write
  packages: write

# Serializes merges to main so two runs cannot compute the same version number.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  native:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tool
        run: pip install build
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel into venv
        run: python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
      - name: Check console script help
        run: /tmp/v/bin/pintxos --help
      - name: Smoke test server startup
        run: |
          export PINTXOS_HOST=127.0.0.1 PINTXOS_PORT=8123 PINTXOS_DATA_DIR=/tmp/pintxos-data
          export PINTXOS_NO_SCHEDULER=1
          cd /tmp
          /tmp/v/bin/pintxos > /tmp/pintxos-server.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/health > /dev/null; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" || true
          wait "$pid" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "Server never became healthy; log follows:"
            cat /tmp/pintxos-server.log
            exit 1
          fi

  version:
    needs: [test, native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prev: ${{ steps.version.outputs.prev }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: version
        name: Compute version
        run: |
          version="$(python scripts/next_version.py)"
          prev="$(git tag --list 'v[0-9][0-9].[0-9][0-9].*' --sort=-v:refname | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

  build:
    needs: [version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            slug: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PINTXOS_VERSION=${{ needs.version.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,scope=${{ matrix.slug }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The semver tag type is dropped because a leading zero in the month
          # (26.09.1) is not valid semver and would silently emit no tag.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha
      - name: Create manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
      - id: tag
        name: Tag release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - id: release
        name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          PREV: ${{ needs.version.outputs.prev }}
        run: |
          args=(-f tag_name="v$VERSION")
          if [ -n "$PREV" ]; then args+=(-f previous_tag_name="$PREV"); fi
          gh api "repos/${{ github.repository }}/releases/generate-notes" "${args[@]}" --jq .body > notes.md
          if [ -n "$PREV" ]; then range="$PREV..HEAD"; else range="HEAD"; fi
          {
            echo
            echo "<details><summary>Commits</summary>"
            echo
            git log --no-merges --pretty='- %s' -n 200 "$range"
            echo
            echo "</details>"
          } >> notes.md
          gh release create "v$VERSION" --title "Pintxos $VERSION" --notes-file notes.md
