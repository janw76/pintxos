name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'LICENSE']

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  native:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tool
        run: pip install build
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel into venv
        run: python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
      - name: Check console script help
        run: /tmp/v/bin/pintxos --help
      - name: Smoke test server startup
        run: |
          export PINTXOS_HOST=127.0.0.1 PINTXOS_PORT=8123 PINTXOS_DATA_DIR=/tmp/pintxos-data
          export PINTXOS_NO_SCHEDULER=1
          cd /tmp
          /tmp/v/bin/pintxos > /tmp/pintxos-server.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/health > /dev/null; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" || true
          wait "$pid" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "Server never became healthy; log follows:"
            cat /tmp/pintxos-server.log
            exit 1
          fi

  image:
    needs: [test, native]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha
