{% macro info(id, what, icon="help") %}<button type="button" class="info-btn" aria-label="More about {{ what }}" aria-expanded="false" aria-controls="{{ id }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ico" aria-hidden="true">{% if icon == "info" %}<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>{% else %}<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>{% endif %}</svg></button><span class="info-box" id="{{ id }}" role="note">{{ caller() }}</span>{% endmacro %}
