<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pintxøs{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%234c6ef5'/%3E%3Ctext%20x='16'%20y='23'%20text-anchor='middle'%20font-family='ui-sans-serif,%20system-ui,%20sans-serif'%20font-size='22'%20font-weight='700'%20fill='%23ffffff'%3E%C3%B8%3C/text%3E%3C/svg%3E">
  {% block head %}{% endblock %}
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1c1e;
      --text-muted: #6b7280;
      --border: #e4e7eb;
      --accent: #4c6ef5;
      --danger: #b00020;
      --success: #1a7a1a;
      --surface: #f7f8fa;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.015em; margin: 0 0 1.25rem; }
    h2 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 .75rem; color: var(--text); }
    form h2:first-of-type { margin-top: 0; }
    h3 { font-size: .9375rem; font-weight: 600; margin: 1rem 0 .5rem; color: var(--text); }

    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    header .wordmark { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1; color: var(--text); text-decoration: none; }
    header nav { display: flex; align-items: center; gap: 1rem; }
    header nav a { color: var(--text-muted); text-decoration: none; }
    header nav a:hover { color: var(--text); }
    header nav a[aria-current="page"] { color: var(--accent); font-weight: 600; }

    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 0.875rem; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
    th:first-child, td:first-child { padding-left: 0; }
    th:last-child, td:last-child { padding-right: 0; }
    thead th { font-size: 0.8125rem; font-weight: 600; color: var(--text-muted); padding-top: 0.3rem; padding-bottom: 0.3rem; white-space: nowrap; overflow-wrap: normal; }
    /* ponytail: below tablet width the fixed 6-column grid cannot fit; let .table-wrap scroll instead. */
    @media (max-width: 720px) { table { table-layout: auto; min-width: 640px; } }
    tbody tr:hover { background: var(--surface); }
    tbody tr:last-child td { border-bottom: none; }
    td.nowrap { white-space: nowrap; }
    td.actions { text-align: right; white-space: nowrap; }
    td.actions form + form { margin-left: 0.5rem; }
    td.actions a.button { margin-right: 0.5rem; }
    .empty { padding: 2rem 0; color: var(--text-muted); }

    form { display: inline; }
    .add-form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .add-form input { flex: 1; min-width: 0; }

    input[type=url], input[type=text], input[type=number], input[type=password], textarea, select {
      font: inherit;
      font-size: 0.9375rem;
      color: var(--text);
      background: #ffffff;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(76, 110, 245, 0.15);
    }
    input:disabled, textarea:disabled, select:disabled { background: #f4f5f7; color: var(--text-muted); }
    ::placeholder { color: #9aa1ab; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.8125rem; }

    button, a.button {
      font: inherit;
      font-size: 0.875rem;
      color: var(--text);
      background: #ffffff;
      padding: 0.35rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }
    a.button { display: inline-block; text-decoration: none; }
    table button, table a.button { font-size: 0.8125rem; padding: 0.25rem 0.55rem; }
    button:hover, a.button:hover { border-color: #cdd2d9; background: var(--surface); }
    button:focus-visible, a.button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary { color: #ffffff; background: #3f5fd8; border-color: #3f5fd8; }
    .btn-primary:hover { background: #3151c9; border-color: #3151c9; }
    .btn-tint-accent { color: #3151c9; background: #eef2ff; border-color: #d6ddfb; }
    .btn-tint-accent:hover { background: #e0e7ff; border-color: #c3cdf7; }
    .btn-tint-neutral { color: var(--text); background: var(--surface); border-color: var(--border); }
    .btn-tint-neutral:hover { background: #eceff3; }
    .btn-danger { color: var(--danger); background: #fdf3f4; border-color: #f3c9ce; }
    .btn-danger:hover { color: var(--danger); background: #fbe4e7; border-color: var(--danger); }

    .url-cell { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .output-url {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8125rem;
      color: var(--text);
      background: var(--surface);
      padding: 0.15rem 0.4rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      user-select: all;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    .flash, .msg {
      font-size: 0.9375rem;
      padding: 0.625rem 0.875rem;
      border: 1px solid;
      border-radius: 8px;
      margin-bottom: 1.25rem;
    }
    .flash { color: var(--danger); background: #fdf3f4; border-color: #f3d4d8; }
    .msg { color: var(--success); background: #f2f9f2; border-color: #cfe6cf; }
    .error { color: var(--danger); }
    .muted { color: var(--text-muted); font-size: 0.875rem; overflow-wrap: anywhere; }

    .field { max-width: 26rem; margin-bottom: 1.25rem; }
    .field label { display: block; font-weight: 500; margin-bottom: 0.3rem; }
    .field input, .field textarea, .field select { width: 100%; }
    .field .muted { margin-top: 0.35rem; }
    .field-narrow input { max-width: 8rem; }
    .field-checkbox label { display: flex; align-items: center; gap: 0.4rem; font-weight: 400; }
    .field-checkbox input[type=checkbox] { width: auto; }
    fieldset.field { border: 0; padding: 0; }
    fieldset.field legend { padding: 0; font-weight: 500; margin-bottom: 0.3rem; font-size: inherit; }

    .radios { display: flex; gap: 1rem; flex-wrap: nowrap; }
    @media (max-width: 600px) { .radios { flex-direction: column; gap: 0.4rem; } }
    label.radio { display: inline-flex; gap: 0.35rem; align-items: center; font-weight: 400; }

    textarea[readonly], .global-box { background: var(--surface); color: var(--text-muted); }

    .patterns:has(input[value="off"]:checked) .global-box,
    .patterns:has(input[value="off"]:checked) textarea { opacity: 0.45; pointer-events: none; }
    .patterns:has(input[value="inherit"]:checked) textarea[name=ad_title_patterns] { opacity: 0.45; pointer-events: none; }
    .filters:has(input[name=filter_ads][value="off"]:checked) .patterns { opacity: 0.45; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="wordmark">Pintxøs</a>
    <nav>
      <a href="/"{% if request.url.path == '/' %} aria-current="page"{% endif %}>Feeds</a>
      <a href="/settings"{% if request.url.path == '/settings' %} aria-current="page"{% endif %}>Settings</a>
      <a href="https://github.com/janw76/pintxos" rel="noopener">GitHub</a>
    </nav>
  </header>
  {% if request.query_params.get('err') %}<p class="flash" role="alert">{{ request.query_params.get('err') }}</p>{% endif %}
  {% if request.query_params.get('msg') %}<p class="msg" role="status">{{ request.query_params.get('msg') }}</p>{% endif %}
  {% block content %}{% endblock %}
  <script>
    // ponytail: one tiny inline script for the copy buttons, no bundler needed.
    function pintxosCopy(btn, text) {
      navigator.clipboard.writeText(text);
      var old = btn.textContent;
      btn.textContent = "Copied!";
      setTimeout(function () { btn.textContent = old; }, 1200);
    }
    // Flash text lives in ?msg=/?err=; strip it after the first render so reload/back/bookmark stay clean.
    if (/[?&](msg|err)=/.test(location.search)) history.replaceState(null, "", location.pathname);
  </script>
</body>
</html>
