{% extends "base.html" %}
{% block title %}Feeds · Pintxøs{% endblock %}
{% block content %}
<h1>Feeds</h1>

<form class="add-form" method="post" action="/feeds">
  <input type="url" name="url" placeholder="https://example.com/feed" required>
  <button type="submit" class="btn-primary">Add</button>
</form>

<div class="table-wrap">
  <table>
    <!-- Widths are budgeted against a 968px table (1000px viewport - 2rem body padding);
         every column is wider than its widest unbreakable content, and the actions column
         holds Edit filters / Poll now / Delete on one line. The poll button carries the
         poll state (Polling… / Failed) with the detail in its tooltip, so there is no
         Status column. See pintxos-gno.9 and pintxos-gno.11.
         Actions at 968px: 72 + 88 (poll min-width) + 52 + gaps ≈18 + padding 12 ≈ 242 ≤ 26% = 252. -->
    <colgroup>
      <col style="width: 17%">
      <col style="width: 17%">
      <col style="width: 10%">
      <col style="width: 9%">
      <col style="width: 11%">
      <col style="width: 10%">
      <col style="width: 26%">
    </colgroup>
    <thead>
      <tr>
        <th>Feed</th>
        <th>Output URL</th>
        <th></th>
        <th>Items</th>
        <th>Last polled</th>
        <th>Last error</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for feed in feeds %}
      {% include "_feed_row.html" %}
      {% else %}
      <tr><td colspan="7" class="empty">No feeds yet — add one above.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
<script>
  // ponytail: "Poll now" fires a fetch instead of navigating, then swaps just that row
  // in place; a background /status poll catches rows whose poll finishes on its own.
  var pintxosStatusSnapshot = {};
  (function () {
    var buttons = document.querySelectorAll("button.btn-polling[data-feed-id]");
    for (var i = 0; i < buttons.length; i++) {
      pintxosStatusSnapshot[buttons[i].getAttribute("data-feed-id")] = buttons[i].title;
    }
  })();

  function pintxosRefreshRow(id) {
    fetch("/feeds/" + id + "/row").then(function (resp) {
      if (resp.status === 200) {
        resp.text().then(function (html) {
          var row = document.getElementById("feed-" + id);
          if (row) { row.outerHTML = html; }
        });
      } else if (resp.status === 404) {
        var row = document.getElementById("feed-" + id);
        if (row) { row.parentNode.removeChild(row); }
      }
    }).catch(function () {});
  }

  document.addEventListener("submit", function (event) {
    var form = event.target;
    if (!form || form.tagName !== "FORM" || form.action.slice(-5) !== "/poll") { return; }
    event.preventDefault();
    var row = form.closest("tr[data-feed-id]");
    var id = row ? row.getAttribute("data-feed-id") : null;
    fetch(form.action, { method: "POST", headers: { "X-Requested-With": "fetch" } }).then(function () {
      if (id) { pintxosRefreshRow(id); }
    }).catch(function () {});
  });

  setInterval(function () {
    if (document.visibilityState !== "visible") { return; }
    fetch("/status").then(function (resp) {
      if (!resp.ok) { return; }
      resp.json().then(function (data) {
        var ids = {};
        var id;
        for (id in pintxosStatusSnapshot) { ids[id] = true; }
        for (id in data) { ids[id] = true; }
        for (id in ids) {
          if (pintxosStatusSnapshot[id] !== data[id]) { pintxosRefreshRow(id); }
        }
        pintxosStatusSnapshot = data;
      });
    }).catch(function () {});
  }, 3000);
</script>
{% endblock %}
