{% extends "base.html" %}
{% block title %}Feeds · Pintxøs{% endblock %}
{% block content %}
<h1>Feeds</h1>

<form class="add-form" method="post" action="/feeds">
  <input type="url" name="url" placeholder="https://example.com/feed" required>
  <button type="submit" class="btn-primary">Add</button>
</form>

<div class="table-wrap">
  <table>
    <!-- Widths are budgeted against a 968px table (1000px viewport - 2rem body padding);
         every column is wider than its widest unbreakable content, and the actions column
         holds Edit filters / Poll now / Delete on one line. The poll button carries the
         poll state (Polling… / Failed) with the detail in its tooltip, so there is no
         Status column. See pintxos-gno.9 and pintxos-gno.11.
         Actions at 968px: 72 + 88 (poll min-width) + 52 + gaps ≈18 + padding 12 ≈ 242 ≤ 26% = 252. -->
    <colgroup>
      <col style="width: 17%">
      <col style="width: 17%">
      <col style="width: 10%">
      <col style="width: 9%">
      <col style="width: 11%">
      <col style="width: 10%">
      <col style="width: 26%">
    </colgroup>
    <thead>
      <tr>
        <th>Feed</th>
        <th>Output URL</th>
        <th></th>
        <th>Items</th>
        <th>Last polled</th>
        <th>Last error</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for feed in feeds %}
      {% include "_feed_row.html" %}
      {% else %}
      <tr><td colspan="7" class="empty">No feeds yet — add one above.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% if status %}
<script>
  // ponytail: poll /status in place instead of reloading the whole page every 3s.
  var pintxosPollTimer = setInterval(function () {
    fetch("/status").then(function (resp) {
      if (!resp.ok) { return; }
      resp.json().then(function (data) {
        var buttons = document.querySelectorAll("button.btn-polling[data-feed-id]");
        var finished = false;
        for (var i = 0; i < buttons.length; i++) {
          var id = buttons[i].getAttribute("data-feed-id");
          if (id in data) { buttons[i].title = data[id]; }
          else { finished = true; }
        }
        if (finished) { clearInterval(pintxosPollTimer); location.reload(); }
      });
    }).catch(function () {});
  }, 3000);
</script>
{% endif %}
{% endblock %}
